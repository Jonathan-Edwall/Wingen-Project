sample_coordinates_file: "/proj/uppmax2025-2-125/nobackup/jonathan/Wingen-Project/data/raw/genetic_variation_herring/125_individual_info_list_shared_with_media_coordinates.xlsx" # Herring 125 Ind Global Dataset
study_species: herring_sentieon_125ind # Herring 125 Ind Global Dataset
gene_chrom_file: "/proj/uppmax2025-2-125/nobackup/jonathan/Wingen-Project/data/raw/genetic_variation_herring/gene_chrom.tsv"  # Herring 125 Ind Global Dataset required if the gene list comes from a txt file or or array; built by code/build_gene_chrom_map.py.
gene_list_file: "/proj/uppmax2025-2-125/nobackup/jonathan/Wingen-Project/data/raw/genetic_variation_herring/unique_genes.txt"
gene_scope: all
vcf_annotation_format: snpeff # Herring 125 Ind Global Dataset
gd_stat: "pi" # or "watterson_theta"
gd_label: ""
gd_label_short: ""
neutral_vcf: null  # already-neutral BGZF VCF; when provided, markers_file and its table settings are ignored
# Optional convenience: dataset-only settings merged into wingen_params below.
# To use the original flat layout, move these active entries into the single
# wingen_params mapping, then comment this whole block AND its << merge line.
# Top-level settings such as input_vcf can appear anywhere, once per key.
dataset_wingen_params: &dataset_wingen_params
  RESOLUTION_KM: 10 # Good for Herring 125 Ind Global Dataset
  WDIM: 7 # Good for Herring 125 Ind Global Dataset
  FACT: 1 # Good for Herring 125 Ind Global Dataset
  USE_RARIFY: FALSE # TRUE/FALSE  # Herring 125 Ind Global Dataset
  MAX_INTERP_DIST_SCALE: 5 # Herring 125 Ind Global Dataset
  ENV_PRESET: global # Herring 125 Ind Global Dataset


