gene_list_limit: 12
# gene_list_limit: 1
# Keep the latest config's 12-gene test cap; set null for the full generated list.


# "all" (default) | "body" | "exonic" | "cds" - narrows each gene's
# filtered VCF down to a specific annotation scope before it reaches the
# Rmd, via filter_vcf_by_scope.sh. Requires vcf_annotation_format: snpeff
# (the "bed" pathway has no ANN to check scope against). See
# filter_vcf_by_scope.sh's own header comment for what each scope means.
# gene_scope is set once in the active dataset block above.

# "snpeff": hand the gene ID and chromosome to filter_vcf_by_chr_or_gene.sh in
#           gene mode - that script does its own SnpEff-ANN-vs-fallback
#           detection from the VCF header, not from this flag (see its
#           own header comment - this name is a bit of a misnomer now)
# "bed":    a .bed gene_list_file maps each gene to a chr:start-end region, script
#           is called in chr mode with that region instead
# vcf_annotation_format: snpeff # Herring 125 Ind Global Dataset
# vcf_annotation_format: bed # Herring SECD


# Genetic diversity statistic to map, carried through window/location statistics, plots, filenames and the catalog.
# Existing metrics use window_gd(); tajimas_d and theta use window_general() with a dosage matrix.
#   "pi"                 - nucleotide diversity (default)
#   "Ho"                 - average observed heterozygosity
#   "biallelic_richness" - average allelic richness across biallelic SNPs
#   "tajimas_d"          - Tajima's D (unscaled, can be negative; NA without segregating sites)
#   "theta"              - Watterson's theta (hierfstat::theta.Watt.dosage), L = original number of variant columns
# "watterson_theta" remains accepted as a compatibility alias for theta.
# gd_stat: "pi" # pi / Ho / biallelic_richness / tajimas_d / theta
# gd_stat: "biallelic_richness" # pi / Ho / biallelic_richness / tajimas_d / theta

# Missing genotypes for tajimas_d/theta only (does not change existing metrics):
# Missing cells mean an individual's genotype is unavailable at a specific site.
#   hierfstat      - native NA handling, with no extra complete-site filtering (default, as in Wingen pi)
#   complete_sites - opt in to dropping a site if any selected individual's genotype is missing
# Theta still divides by the original number of VCF variant columns, before any complete-site filtering.
gd_dosage_missing_policy: "hierfstat"

# Optional text overrides (leave commented out to get the defaults below)
#   gd_label       - long form: plot titles and the heading of gene_catalog.html
#   gd_label_short - short form: colour-bar/legend titles and the column
#                    headers in gene_catalog.html (e.g. "π r2", "Ho r2")
# Defaults:
#   gd_stat              gd_label                         gd_label_short
#   pi                   Nucleotide diversity (π)         π
#   Ho                   Observed heterozygosity (Ho)     Ho
#   biallelic_richness   Allelic richness (biallelic)     AR
#   tajimas_d            Tajima's D                      D
#   theta                Watterson's theta (θ)           θ
# When changing gd_stat, update or comment out the overrides below to get the matching defaults.

# gd_label: "Nucleotide diversity (π)"
# gd_label_short: "π"
# gd_label: "Allelic richness (biallelic)"
# gd_label_short: "AR"


# gd_stat: "tajimas_d" # or "watterson_theta"
# gd_label: ""
# gd_label_short: ""
# gd_dosage_missing_policy: "complete_sites"
# results_dir: "gene_catalog/herring_secd_at_td_v2"
# results_dir: "gene_catalog/herring_secd_at_td_v3_eff"
# gd_stat: "watterson_theta" # or "watterson_theta"
# gd_label: ""
# gd_label_short: ""
# # gd_dosage_missing_policy: "complete_sites"
# results_dir: "gene_catalog/herring_secd_theta"

calc_gen_diversity_stats: TRUE
use_copernicus_marine: TRUE

# Neutral simulations; The neutral markers are either supplied/created through the neutral inputs or a neutral marker file is created using SnpEff intergenic SNPs.
# Scripts: 1 reads optional marker tables (or snpeff_vcf_create_neutral_marker_file.sh extracts intergenic SNP positions), 2 prepares VCFs with bcftools, 3 samples reproducible subsets; 2 then extracts the planned subset VCFs.
run_neutral_sim: true  # single toggle for neutral Snakemake rules and RUN_NEUTRAL_SIM in the Rmd
# DEBUG only: limit the shared pool used by ALL neutral simulations/reference.
# Omitted/null (default) keeps every eligible marker; positive N samples up to N.
# This changes the null sampling population and can change p-values/thresholds.
# The complete source is still prepared/validated once; downstream work is capped.
neutral_pool_max_markers: null
neutral_pool_seed: 42

# Optional catalog reference row: this is what was formerly All_neutral_markers.
# It is a fake gene for a pooled reference, not a Monte Carlo replicate.
# false skips the extra analysis; true adds the configured reference to the catalog.
# Reuses neutral_vcf when supplied, otherwise the existing neutral-pool inputs.
include_all_neutral_markers: true
neutral_reference_id: "neutral_marker_reference"
# Only cap that extra reference row; does not further limit the simulation pool.
# Omitted/null = all pool markers; a positive integer = random subset up to N.
# 100000 below is an explicit first-test setting, not the omitted-key default.
neutral_reference_max_markers: 100000
neutral_reference_seed: 42
# Run the reference after retained ordinary reports. "auto" reserves the
# allocation's available memory minus headroom; it does not impose an R limit.
# Without a Snakemake/Slurm memory budget, auto falls back to 40000 MB.
neutral_reference_mem_mb: "auto"
neutral_reference_headroom_mb: 4096
# Scheduling metadata only; the enclosing Slurm allocation sets the time limit.
neutral_reference_runtime_minutes: 720
# One R worker avoids extra copies of large genotype objects.
neutral_reference_threads: 1

# auto (also the omitted-key default) uses workflow.cores for preparation CPUs.
# This is Snakemake's --cores budget, not every physical CPU on the machine.
# Memory auto separately uses the declared Snakemake/Slurm memory budget.
# Resource requests control scheduling; they do not make a process use RAM.
neutral_preparation_threads: "auto"
neutral_preparation_mem_mb: "auto"
neutral_preparation_headroom_mb: 4096
# Per-gene plans/extraction can run concurrently; the 100 replicate files are
# still extracted serially within each gene. Threads aid compression/indexing.
neutral_subset_threads: 2
neutral_subset_mem_mb: 8000

# For automatic extraction from input_vcf, set vcf_annotation_format: snpeff and leave BOTH markers_file and neutral_vcf null/unset.
# All ANN effects at a retained SNP must be intergenic_region; upstream/downstream are excluded.
# SnpEff's flanking gene IDs on intergenic annotations are allowed. Missing or invalid ANN is excluded.
# The rule logs candidate/exclusion counts and writes a CHROM/POS TSV (1-based positions, no intervals) for extract_neutral_pool.
# markers_file is required for bed mode when neutral_vcf is unset.
# Accepts an annotated table, a table already containing only neutral markers, a headerless 1-based CHROM/POS list, or single-base BED intervals.
# markers_file: "/proj/uppmax2025-2-125/nobackup/jonathan/Wingen-Project/data/raw/herring_2026_Swedish_East_Coast/pnas.2526500123.sd03.xlsx" # Herring SECD
# neutral_vcf: null  # already-neutral BGZF VCF; when provided, markers_file and its table settings are ignored
input_format: "auto"  # auto: .bed[.gz] -> bed, otherwise table; use positions for a headerless CHROM/POS list
sheet: "Sheet1"
header_row: "auto"  # detect coordinate headers in XLSX/TSV/CSV; or set a 1-based row number
chrom_column: 1  # 1-based column number or header name
pos_column: 2
# Select the annotation column by its header name (case-insensitive), e.g. TYPE,
# or by its 1-based column number, e.g. 5 means the fifth column.
marker_label_column: "TYPE"
# Keep rows whose marker_label_column equals this text, ignoring case and surrounding whitespace.
# This is an annotation label, not the toggle that enables neutral simulations.
neutral_marker_label: "NEUTRAL"
neutral_only: false  # true: table already contains only neutral markers; ignore marker_label_column/neutral_marker_label
technical_replicates: 100 # number of random neutral SNP sets; one saved subset VCF per set
seed: 42  # configurable base seed; deterministic gene-specific RNG advances between random sets
# Minimum fraction of requested replicates with a finite correlation, separately
# for each environmental variable and Pearson/Spearman. 0.9 means >=90 of 100.
# Missing/non-finite diversity or zero variance can make a correlation undefined;
# insufficient valid replicates gives unavailable p neutral and neutral thresholds.
# File/extraction errors stop the workflow; they are not tolerated by this setting.
min_valid_fraction: 0.9
extreme_value_percentiles: [95, 99]  # percentile levels for neutral |r| and |rho| cutoffs; e.g. [95], [90, 97.5], or []





# # Region of interest, WGS84
# lat_min: 30 # herring_sentieon_125ind
# lat_max: 72 # herring_sentieon_125ind
# lon_min: -25 # herring_sentieon_125ind
# lon_max: 60 # herring_sentieon_125ind

# Wingen tuning knobs - passed straight through as env vars the Rmd reads
# via Sys.getenv(). Anything left commented out here falls back to
# whatever default is hardcoded in the Rmd itself - exactly like leaving
# the matching export commented out in 2_wingen_create_gene_catalog.sh
# does today. Dataset settings above are merged with the shared settings below.
wingen_params:
  # Optional: comment this merge line if the dataset block above is commented.
  # In flat mode, put all desired tuning entries directly in this mapping.
  <<: *dataset_wingen_params
  # Performance test: 0 forces efficient windows/kriging; "Inf" selects native.
  # Compare runs with the same scientific settings and separate results_dir values.
  GRID_MIN_CELLS: 0
  WINGEN_DIAGNOSTICS: FALSE
  GRID_VALIDATE: FALSE
  PREVIEW_WINDOWS: TRUE # window-setting preview, independent of diagnostic checks
  GRD_DISAGG_FACTOR: 3
  # RESOLUTION_KM: 10 # Good for Herring 125 Ind Global Dataset

  # CTR_DISAGG:
  # WDIM: 7 # Good for Herring 125 Ind Global Dataset
  # FACT: 1 # Good for Herring 125 Ind Global Dataset
  # MIN_N_SAMPLES_PER_CALC:
  # USE_RARIFY: TRUE # TRUE/FALSE # Herring SECD
  # USE_RARIFY: FALSE # TRUE/FALSE  # Herring 125 Ind Global Dataset
  # RARIFY_N: 10 # Herring SECD
  # RARIFY_N_ITERATIONS:
  USE_WEIGHTED_KRIGING: TRUE # TRUE/FALSE
  NMAX_NEIGHBOURS: 15
  # MAX_INTERP_DIST_MODE:
  # MAX_INTERP_DIST_KM:
  # MAX_INTERP_DIST_SCALE: 5 # Herring 125 Ind Global Dataset
  # MAXDIST:
  # MAX_RANGE_FRAC:
  # MIN_SAMPLE_COUNT_MODE: # "hardcoded"/"none"
  # MIN_SAMPLE_COUNT:
  # MASKING_POLYGON:
  # SHOW_SAMPLE_POINTS: # # "All"/"count"/"value"
  # SAMPLE_POINT_SIZE_BY:
  # SPHERICAL_GRID:
  HEATMAP_COLOR_PALETTE: "turbo" # "inferno" (default), "mako", "rocket", "turbo", "cividis", "plasma", "viridis" "magma".
  CLUSTER_VARIANCE_POINTS_KM: 10 # complete-linkage location clusters for genotype statistics
  # Display only: omitted/null inherits the value above; 0 = exact sites; positive = km cutoff.
  CLUSTER_SAMPLE_POINTS_KM: null
  SPACING_CLUSTER_KM: 2 # only for the optional clustered-spacing interpolation cutoff

  # LOCATION_RARIFY decides whether the per-LOCATION values (the "Location" columns, and every location-level R2/r/p) are
  # rarefied to RARIFY_N individuals like the window values are. auto retains all eligible individuals for every metric except
  # biallelic_richness, for which it uses individual subsampling when USE_RARIFY is on. Subsampling changes the estimate with the seed
  # and can reduce differences in sample size, but smaller clusters retain all individuals and genotype call rates can differ.
  # It does not guarantee equal precision; current location correlations give each eligible cluster equal weight.
  #   auto  - rarefy locations only for biallelic_richness (when USE_RARIFY is on)   <- recommended
  #   TRUE  - always, like the windows      FALSE - never
  LOCATION_RARIFY: auto

  # ---- Reproducibility ---------------------------------------------------------------------------------------
  # The window functions rarefy by drawing random individuals, so the window values (maps, window R2) used to change slightly on every re-run -> with a seed they are identical every time.
  SEED: 42

  # ---- Environmental data from Copernicus Marine -------------------------------------------------------------
  # ENV_PRESET picks the datasets: "global" (what the prototype used) or "baltic" - see config/env_presets.yaml for exactly
  # which products each uses, what they cover, and how to add your own.
  # ENV_PRESET: baltic # Herring SECD
  # ENV_PRESET: global # Herring 125 Ind Global Dataset
  # Baseline = the years the environmental values are averaged over. Trimmed automatically to what each dataset covers
  # (the trimming is announced in the log and the years used are written to the gene's JSON). 1998 is the first full year
  # of the ocean-colour products; 25 years is a defensible "typical conditions" window.
  ENV_BASELINE_START_YEAR: 1998
  ENV_BASELINE_END_YEAR: 2022
  # ENV_DEPTH_M: 0   # top layer for salinity, temperature and current speed
  ENV_OXYGEN_ENABLED: TRUE
  ENV_CURRENT_SPEED_ENABLED: TRUE
  # Oxygen uses the preset's biogeochemical product; current speed uses its physics product.
  # Both use the baseline above. Oxygen defaults to the same depth as ENV_DEPTH_M.
  # ENV_OXYGEN_DEPTH_M: 0   # optional oxygen-specific depth, in metres below the surface

  # ---- Optional outputs - set to FALSE to switch one off (no code editing needed) ------------------------------
  WRITE_PER_LOCATION_TSV: TRUE   # {gene}_per_location.tsv next to the plots: one row per location (the audit trail)
  WRITE_LOCATION_STATS: TRUE     # n, signed r, 95% CI, p and Spearman rho of each location-level fit -> JSON/TSV/catalog
  WRITE_RUN_SETTINGS: TRUE       # the settings that produced each gene's numbers -> JSON


