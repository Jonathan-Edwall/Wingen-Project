# config.yaml - Wingen gene-catalog pipeline

# Root directory for THIS gene catalog's entire output tree, split into
# four siblings once a run actually happens:
#   {results_dir}/.snakemake_gene_catalog/  - Snakemake's own per-gene .done markers
#   {results_dir}/benchmarks/               - per-gene runtime/memory (Snakemake --benchmark)
#   {results_dir}/temp/                     - working data: filtered_vcf/, env_cache/, ne_cache/
#   {results_dir}/results/                  - the deliverable: per-chrom PNGs/JSON,
#                                              gene_catalog.duckdb/.tsv/.html
# Nothing under one results_dir is ever read, written, or globbed by a run
# pointed at a different one, so this is the one knob to change to keep
# two catalogs from colliding - whether that's two different datasets
# (herring vs. krill) or two variants of the SAME dataset (e.g. a "cds"
# catalog and a "body" catalog run from the same input_vcf, which WOULD
# otherwise share gene IDs and silently overwrite each other's files).
#
# Recommended shape: nest under a shared "results/" parent, one subfolder
# per catalog, rather than sitting bare at the repo root or nesting under
# "gene_catalog/" instead - "results/" is already the long-standing,
# .gitignore-able convention for "pipeline output, not pipeline code", one
# entry covers every current and future catalog, and nesting under
# "gene_catalog/" would just reintroduce the "gene_catalog/gene_catalog..."
# stutter that naming the deliverable subfolder "results/" (above) removes:
#   results_dir: "results/gene_catalog_herring_cds"
#   results_dir: "results/gene_catalog_herring_body"
#   results_dir: "results/gene_catalog_krill"
# Relative paths are resolved against wherever you run `snakemake` from
# (the repo root, by convention here); an absolute path works too.
# results_dir: "results/gene_catalog"
# results_dir: "results/gene_catalog_herring_secd"
# results_dir: "results/gene_catalog_herring_secd_complete_link"
# results_dir: "results/gene_catalog_herring_secd_compl_no_strat_AR"

