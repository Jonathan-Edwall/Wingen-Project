name: krill_env
channels:
  - conda-forge
  - defaults
  - r
  - bioconda  
dependencies:
  - r-base>=4.1        # wingen requires R >= 4.1.0
  - rstudio-desktop      # RStudio
  - qt-wayland # Dependency for RStudio
  - conda-lock
  - python
  - pip # include pip so pip-based fallbacks can be used if needed
  # - r-wingen's actual dependencies (from CRAN: https://cran.r-project.org/web/packages/wingen/index.html)
  - r-crayon
  - r-dplyr
  - r-furrr
  - r-gdistance
  - r-ggplot2
  - r-gstat
  - r-hierfstat
  - r-lifecycle
  - r-magrittr
  - r-pegas
  - r-purrr
  - r-raster
  - r-rlang
  - r-sf
  - r-terra
  - r-tidyr
  - r-tidyselect
  - r-vcfr
  - r-viridis
  
# Optional: if any package is not available on conda-forge you can put it under pip:
#  - pip:
#    - undetected-chromedriver   # example fallback via pip if conda package not found

