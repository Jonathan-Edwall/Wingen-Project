  #lightbox .caption {

<script>
const rows = JSON.parse(document.getElementById('gene-data').textContent);
const columnLayout = JSON.parse(document.getElementById('gene-columns').textContent);

function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : v.toFixed(6);
  return String(v);
}

// One pass over columnLayout builds both the (possibly two-row) <thead>
// and the flat leaf-column list DataTables binds data/sorting to - driven
// by the same list, so header markup and column config can't drift apart.
// A plain entry ({key, label, numeric}) is one column; a grouped entry
// ({group, columns}) is a colspan header over its own sub-columns, "key"
// on each sub-column being dot-notation DataTables resolves against the
// nested row data itself (row.windows.variance etc.) with no extra code.
function buildHeaderAndColumns(layout) {
  const hasGroups = layout.some((c) => c.group);
  const topRow = document.createElement('tr');
  const subRow = document.createElement('tr');
  const leafColumns = [];

  const thumbTh = document.createElement('th');
  if (hasGroups) thumbTh.rowSpan = 2;
  topRow.appendChild(thumbTh);
  leafColumns.push({ data: 'plots', orderable: false, className: 'thumb', render: renderThumb });

  for (const col of layout) {
    const th = document.createElement('th');
    if (col.group) {
      th.textContent = col.group;
      th.colSpan = col.columns.length;
      th.className = 'group';
      topRow.appendChild(th);
      for (const sub of col.columns) {
        const subTh = document.createElement('th');
        subTh.textContent = sub.label;
        subRow.appendChild(subTh);
        leafColumns.push(toDtColumn(sub));
      }
    } else {
      th.textContent = col.label;
      if (hasGroups) th.rowSpan = 2;
      topRow.appendChild(th);
      leafColumns.push(toDtColumn(col));
    }
  }

  const thead = document.querySelector('#catalog thead');
  thead.appendChild(topRow);
  if (hasGroups) thead.appendChild(subRow);
  return leafColumns;
}

function toDtColumn(col) {
  return {
    data: col.key,
    className: col.numeric ? 'num' : (col.key === 'gene_id' ? 'gene-id' : ''),
    render: fmt,
  };
}

function renderThumb(plots) {
  return plots && plots.length
    ? `<img src="${plots[0]}" data-plots='${JSON.stringify(plots)}'>`
    : '';
}

new DataTable('#catalog', {
  data: rows,
  columns: buildHeaderAndColumns(columnLayout),
  order: [[1, 'asc']],
  pageLength: 25,
  lengthMenu: [10, 25, 50, 100, 500],
  autoWidth: false,
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const caption = lightbox.querySelector('.caption');
let plotIdx = 0, plotList = [];

function showPlot() {
  lightboxImg.src = plotList[plotIdx];
  caption.textContent = `${plotIdx + 1} / ${plotList.length} — ${plotList[plotIdx].split('/').pop()}`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('td.thumb img');
  if (img) {
    plotList = JSON.parse(img.dataset.plots);
    plotIdx = 0;
    showPlot();
    lightbox.classList.add('open');
  } else if (e.target === lightbox) {
    lightbox.classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') lightbox.classList.remove('open');
  if (e.key === 'ArrowRight') { plotIdx = (plotIdx + 1) % plotList.length; showPlot(); }
  if (e.key === 'ArrowLeft') { plotIdx = (plotIdx - 1 + plotList.length) % plotList.length; showPlot(); }
});
</script>
