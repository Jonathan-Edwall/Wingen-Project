<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene catalog</title>
<link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
<style>
  :root {
    --text:  #1a1a1a;
    --muted: #666666;
    --line:  #dddddd;
    --hover: #f5f5f5;
    --mono:  ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }
  body {
    margin: 24px 32px 64px;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .meta {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .meta.error {
    color: #b91c1c;
    background: #fee0e0;
    border: 1px solid #f5b5b5;
    border-radius: 4px;
    padding: 6px 10px;
  }
  .meta.error[hidden] { display: none; }
  table.dataTable {
    width: 100% !important;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.dataTable thead th {
    border-bottom: 2px solid var(--text) !important;
    text-align: left;
    padding: 6px 10px !important;
    white-space: nowrap;
  }
  table.dataTable tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.dataTable tbody tr:hover { background: var(--hover); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.gene-id { font-family: var(--mono); }
  td.thumb { width: 50px; }
  td.thumb img {
    width: 44px; height: 28px; object-fit: cover; cursor: zoom-in; display: block;
  }

  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.85);
    align-items: center; justify-content: center; padding: 32px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; }
  #lightbox .caption {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: var(--mono); font-size: 13px;
  }

  /* Group header cells. They are click-to-hide controls, not sort controls:
     they carry data-dt-order="disable" (set in buildHeader), so DataTables
     draws no sort arrows on them and never sorts when they are clicked. */
  table.dataTable thead th.group {
    text-align: center;
    border-bottom: 1px solid var(--line) !important;
    cursor: pointer;
    user-select: none;
  }
  table.dataTable thead th.group:hover { background: var(--hover); }

  #toolbar {
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 10px 22px; margin-bottom: 14px;
  }
  .decimals-control {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0;
  }
  .decimals-control input {
    width: 3.5em; padding: 2px 4px; font-family: var(--mono); font-size: 13px;
  }

  /* Column-group toolbar. A group with sub-groups (Salinity, Water Temp...)
     is drawn as ONE outlined cluster - the group's own button first, then
     its sub-group buttons inside the same outline - so "Window"/"Location"
     visibly belong to the covariate they sit under, instead of reading as
     more top-level siblings of the top-level "Windows"/"Location". */
  #group-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .toolbar-label { font-size: 13px; color: var(--muted); }
  .cluster { display: inline-flex; align-items: center; gap: 4px; }
  .cluster.has-children {
    padding: 1px 4px 1px 1px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: #fafafa;
  }
  .cluster.has-children > .chip { border-color: transparent; background: transparent; font-weight: 600; }
  .cluster.has-children > .chip:hover { background: var(--hover); }
  .cluster-children {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding-left: 6px; margin-left: 2px;
    border-left: 1px solid var(--line);
  }
  .chip {
    font: inherit; font-size: 12px; line-height: 1.4;
    padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: var(--hover); }
  .chip:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .chip.collapsed {
    color: var(--muted); background: var(--hover);
    border-style: dashed; text-decoration: line-through;
  }

  /* Row filter ("Filter genes"): one line per rule -
     [Keep | Highlight] genes where [column] [comparison] [value]. The column list shows every
     numeric column by its FULL nested path ("Salinity › Window › pi r2"), because the short
     labels alone (Var, Mean, pi r2, slope ...) repeat under many groups. */
  #filter-panel { margin-bottom: 14px; }
  #filter-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  #filter-summary { font-size: 13px; color: var(--muted); }
  #filter-rules { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  #filter-rules:empty { margin-top: 0; }
  .filter-rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .filter-lead { display: inline-flex; align-items: center; gap: 6px; min-width: 14.5em; font-size: 13px; color: var(--muted); }
  .filter-rule select, .filter-rule input {
    font: inherit; font-size: 13px; padding: 3px 6px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--text);
  }
  .filter-col { max-width: 100%; }
  .filter-val { width: 7em; font-family: var(--mono); }
  .filter-range, .filter-note { font-size: 12px; color: var(--muted); }
  .filter-range { font-family: var(--mono); }
  .filter-note { font-style: italic; }
  .chip.filter-remove { padding: 1px 8px; color: var(--muted); }
  .chip.filter-remove:hover { color: var(--text); }

  /* Highlight mode. ONE colour, used in two places: the cells of the highlighted column(s),
     and the gene's name - where a thin bar comes with it, so the marking doesn't rest on
     colour alone (it still shows in a grayscale printout). DataTables' own zebra-stripe and
     sorted-column shading is switched off on these cells: stacked on the tint it made every
     other highlighted row look like a different yellow. */
  table.dataTable tbody td.hl,
  table.dataTable tbody td.hl-gene { background-color: #fff3bf; box-shadow: none !important; }
  table.dataTable tbody td.hl-gene { background-image: linear-gradient(to right, #e0a100 0, #e0a100 3px, transparent 3px); }
  .hl-swatch {   /* the same colour as a little key, in front of the "N highlighted" count */
    display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px;
    border: 1px solid #e0c766; border-radius: 2px; background: #fff3bf;
  }
</style>
</head>

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') {
    if (Number.isInteger(v)) return String(v);
    if (v !== 0 && Math.abs(v) < 1e-6) return v.toExponential(2);
    return v.toFixed(decimals);
  }
  return String(v);
}

// DataTables calls render() with type 'display' (what is shown), 'filter'
// (what the search box matches against), and 'sort' / 'type' (what ordering
// and type detection see). Only display/filter get the rounded text;
// ordering always sees the raw number, so changing "Decimals" can never
// reorder rows or create ties between values that differ beyond the
// digits shown.
function renderNumber(v, type) {
  if (type === 'display' || type === 'filter') return fmt(v);
  return v === null || v === undefined ? '' : v;
}

// A tiny inline placeholder (no network request, can't itself fail to
// load) swapped in for any plot image that 404s or fails to decode, so a
// broken PNG shows as a clear, deliberate "this didn't load" instead of
// the browser's own broken-image icon - and so it can't silently vanish
// from the layout while looking like nothing was ever there.
const BROKEN_IMG_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 28">'
  + '<rect width="44" height="28" fill="#fee0e0"/>'
  + '<text x="22" y="19" font-size="15" text-anchor="middle" fill="#b91c1c" font-family="sans-serif">?</text>'
  + '</svg>'
);

function handleImgError(img) {
  if (img.dataset.broken) return; // the placeholder itself never fails to load; this just guards belt-and-braces
  const failedSrc = img.getAttribute('src');
  img.dataset.broken = '1';
  img.src = BROKEN_IMG_PLACEHOLDER;
  img.title = 'Failed to load: ' + failedSrc.split('/').pop();
}

function renderThumb(plots, type, row) {
  if (type !== 'display' || !plots || !plots.length) return '';
  return `<img src="${escapeHtml(plots[0])}" alt="${escapeHtml(row.gene_id)}"`
       + ` data-plots="${escapeHtml(JSON.stringify(plots))}" onerror="handleImgError(this)">`;
}

// --- Column layout tree ------------------------------------------------------
// columnLayout can nest groups inside groups (a covariate's Window/Location
// halves, say). Built once: every group knows its children and every leaf
// beneath it (`leaves`); every leaf knows its DataTables column index
// (`colIdx`) and whether it is currently shown (`visible`).
// "windows.variance" -> a function returning row.windows.variance, or null if any step on
// the way is missing (the same dot-notation DataTables uses for `data: leaf.key`).
function makeGetter(key) {
  const parts = key.split('.');
  return (row) => {
    let v = row;
    for (const p of parts) {
      if (v === null || v === undefined) return null;
      v = v[p];
    }
    return v;
  };
}

function buildNode(node, parentPath) {
  if (node.group) {
    const path = parentPath ? `${parentPath} \u203a ${node.group}` : node.group;
    const group = { isGroup: true, label: node.group, path, chip: null, children: [], leaves: [] };
    group.children = node.columns.map((c) => buildNode(c, path));
    for (const child of group.children) {
      if (child.isGroup) group.leaves.push(...child.leaves);
      else group.leaves.push(child);
    }
    return group;
  }
  return {
    isGroup: false, key: node.key, label: node.label, numeric: !!node.numeric, colIdx: -1, visible: true,
    // The column's full nested path ("Salinity \u203a Window \u203a pi r2"). Unlike `label`
    // (Var, Mean, pi r2, slope ... repeat under many groups) it is unique - the row filter
    // names columns with it. `get` reads this column's value out of one gene's row.
    fullLabel: parentPath ? `${parentPath} \u203a ${node.label}` : node.label,
    get: makeGetter(node.key),
  };
}
const tree = columnLayout.map((node) => buildNode(node, ''));

// Every leaf, left to right. This is DataTables' column order, so
// leaf i is DataTables column i + 1 (column 0 is the thumbnail).
const leaves = [];
(function collect(nodes) {
  for (const n of nodes) {
    if (n.isGroup) collect(n.children);
    else leaves.push(n);
  }
})(tree);
leaves.forEach((leaf, i) => { leaf.colIdx = i + 1; });

function treeDepth(nodes) {
  let max = 1;
  for (const n of nodes) {
    if (n.isGroup) max = Math.max(max, 1 + treeDepth(n.children));
  }
  return max;
}
const maxDepth = treeDepth(tree);

function toDtColumn(leaf) {
  return {
    data: leaf.key,
    className: leaf.numeric ? 'num' : (leaf.key === 'gene_id' ? 'gene-id' : ''),
    type: leaf.numeric ? 'num' : 'string',
    // A gene whose JSON lacks a field (e.g. it errored before computing that
    // block) gets an empty cell rather than DataTables' "unknown parameter" error.
    defaultContent: '',
    // Text columns: escape, so a gene name containing "<" or "&" can't be
    // read as markup (DataTables writes cell content with innerHTML).
    render: leaf.numeric ? renderNumber : DataTable.render.text(),
  };
}

// --- Header ------------------------------------------------------------------
// The full multi-row <thead> is built ONCE, for every column, and never
// rebuilt. Hiding and showing columns is DataTables' own job from here on
// (columns().visible(), see setLeavesVisible): it re-computes each header
// cell's colspan/rowspan from the columns still visible, and drops a group
// cell entirely once nothing under it is visible.
//
// Why this is NOT done by destroying and re-initialising the table on every
// toggle: destroy() puts the old rendered <tr> rows back into the <table>,
// and DataTables' constructor then checks that first leftover row against
// the new `columns` array. Hide a group and the leftover row has MORE cells
// than there are columns -> "Incorrect column count" (tech note 18) and an
// uncaught TypeError halfway through init, leaving a half-built table (and
// a second toggle then removed the table from the page altogether).
function buildHeader() {
  const thead = document.querySelector('#catalog thead');
  const headerRows = Array.from({ length: maxDepth }, () => document.createElement('tr'));

  const thumbTh = document.createElement('th');
  thumbTh.rowSpan = maxDepth;
  headerRows[0].appendChild(thumbTh);

  function place(node, row) {
    const th = document.createElement('th');
    th.textContent = node.label;
    if (node.isGroup) {
      th.colSpan = node.leaves.length;
      th.className = 'group';
      th.title = 'Click to hide this group';
      // DataTables 2 attaches sorting to EVERY header cell, and a cell that
      // spans several columns would multi-sort by all of them. This attribute
      // opts group cells out: no sort arrows, and clicking one only hides it.
      // (A mouse shortcut only - the toolbar buttons are the keyboard/screen-
      // reader route to the same toggle.)
      th.setAttribute('data-dt-order', 'disable');
      th.addEventListener('click', () => hideGroup(node));
      headerRows[row].appendChild(th);
      for (const child of node.children) place(child, row + 1);
    } else {
      // A leaf spans down to the last header row, however deep its group is.
      th.rowSpan = maxDepth - row;
      if (node.numeric) th.className = 'num';
      headerRows[row].appendChild(th);
    }
  }
  for (const node of tree) place(node, 0);
  for (const tr of headerRows) thead.appendChild(tr);
}

// --- Column visibility -------------------------------------------------------
// A group's state is derived from its leaves - nothing is stored per group:
//   'all'  every column under it is shown
//   'none' every column under it is hidden
//   'some' mixed (e.g. Salinity with only its Window half hidden)
function groupState(group) {
  const shown = group.leaves.filter((l) => l.visible).length;
  if (shown === 0) return 'none';
  return shown === group.leaves.length ? 'all' : 'some';
}

let dt = null;

function setLeavesVisible(targets, show) {
  const changed = targets.filter((l) => l.visible !== show);
  if (!changed.length || !dt) return;
  for (const leaf of changed) leaf.visible = show;
  dt.columns(changed.map((l) => l.colIdx)).visible(show);
  if (!show) dropHiddenSortColumns();
  refreshToolbar();
  refreshFilterUi();   // a filter on a column that just got hidden says so
}

// Ordering by a column the reader can no longer see would leave rows in an
// order nothing on screen explains, so drop those sort keys (falling back to
// the default order if none are left).
function dropHiddenSortColumns() {
  const current = dt.order();
  const kept = current.filter(([idx]) => dt.column(idx).visible());
  if (kept.length !== current.length) dt.order(kept.length ? kept : DEFAULT_ORDER).draw(false);
}

// Toolbar button: everything shown -> hide it all; otherwise (hidden or
// mixed) -> show it all.
function toggleGroup(group) {
  setLeavesVisible(group.leaves, groupState(group) !== 'all');
}
// Header click: always "hide".
function hideGroup(group) {
  setLeavesVisible(group.leaves, false);
}

// --- Toolbar -----------------------------------------------------------------
const GLYPH = { all: '\u2611 ', none: '\u2610 ', some: '\u25A3 ' }; // ballot box: checked / empty / partial

// The DOM is built once, and refreshToolbar() only updates each button's
// state in place - so a button keeps keyboard focus after you press it.
function buildToolbar() {
  if (!tree.some((n) => n.isGroup)) return;   // nothing to toggle - leave the toolbar empty
  const container = document.getElementById('group-toolbar');
  const label = document.createElement('span');
  label.className = 'toolbar-label';
  label.textContent = 'Columns:';
  container.appendChild(label);

  // One cluster per group: its button, then (if it has sub-groups) a nested
  // container of clusters for those - recursive, so any depth reads right.
  function clusterFor(group) {
    const subgroups = group.children.filter((c) => c.isGroup);
    const cluster = document.createElement('span');
    cluster.className = 'cluster' + (subgroups.length ? ' has-children' : '');

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.setAttribute('role', 'checkbox');
    chip.title = `Show or hide: ${group.path}`;
    chip.addEventListener('click', () => toggleGroup(group));
    group.chip = chip;
    cluster.appendChild(chip);

    if (subgroups.length) {
      const inner = document.createElement('span');
      inner.className = 'cluster-children';
      for (const sub of subgroups) inner.appendChild(clusterFor(sub));
      cluster.appendChild(inner);
    }
    return cluster;
  }
  for (const node of tree) {
    if (node.isGroup) container.appendChild(clusterFor(node));
  }
  refreshToolbar();
}

function refreshToolbar() {
  (function walk(nodes) {
    for (const n of nodes) {
      if (!n.isGroup) continue;
      const state = groupState(n);
      n.chip.textContent = GLYPH[state] + n.label;
      n.chip.classList.toggle('collapsed', state === 'none');
      n.chip.setAttribute('aria-checked', state === 'all' ? 'true' : state === 'none' ? 'false' : 'mixed');
      walk(n.children);
    }
  })(tree);
}

// --- Row filter --------------------------------------------------------------
// "Filter genes": a list of rules, each "<column> <comparison> <number>", and each with its
// own switch for what the rule DOES:
//   Keep      a gene stays in the table only while it passes every Keep rule; the rest are
//             hidden. Two Keep rules on one column make a range ("Variants >= 10" and
//             "Variants <= 200").
//   Highlight nothing is hidden; a gene that passes every Highlight rule gets one pale tint
//             on its name and on the cells of the highlighted column(s).
// Both can be in use at once (hide some genes, highlight others). Deliberately ONE colour and
// no gradient: a rule answers yes or no, so the marking does too.
//
// A rule is plain data - { leaf, op, value, mode } - and the row of controls in the page only
// edits it, so ruleMatches() doesn't care how a rule came about. `mode` is 'prune' (the Keep
// switch) or 'highlight'. Only 'prune' rules ever reach DataTables' row filter (activePrune),
// so a highlight rule can never hide a row.
//
// Comparisons use the full-precision numbers in the data, never the rounded text in the
// cells - so "Decimals" can't change which genes pass.
//
// A gene with no value in the filtered column (null / missing) FAILS the rule, as a NULL
// does in SQL: there is nothing to compare, so nothing says the gene passes.
const FILTER_OPS = [
  { id: 'ge', label: '\u2265', title: 'at least (\u2265)', test: (v, t) => v >= t },
  { id: 'le', label: '\u2264', title: 'at most (\u2264)',  test: (v, t) => v <= t },
  { id: 'gt', label: '>',      title: 'greater than (>)',  test: (v, t) => v > t },
  { id: 'lt', label: '<',      title: 'less than (<)',     test: (v, t) => v < t },
  // "equal" forgives the last-digit noise between a typed decimal and a stored double.
  { id: 'eq', label: '=',      title: 'equal to (=)',      test: (v, t) => Math.abs(v - t) <= 1e-9 * Math.max(1, Math.abs(t)) },
];

const FILTER_MODES = [
  { id: 'prune',     label: 'Keep',      title: "Hide every gene that doesn't pass" },
  { id: 'highlight', label: 'Highlight', title: 'Hide nothing - tint the genes that pass' },
];

const filterLeaves = leaves.filter((l) => l.numeric);
const leafByCol = new Map(leaves.map((l) => [l.colIdx, l]));
const geneLeaf = leaves.find((l) => l.key === 'gene_id');   // its cell carries the gene-name marker
const filterRules = [];
let activePrune = [];          // Keep rules with a usable value: these hide genes
let activeHighlight = [];      // Highlight rules with a usable value: these tint genes
let lastPruneSignature = '';   // what the table was last drawn with - only Keep rules change WHICH genes show, so only they need a redraw
let filterPanelReady = false;
// Every cell that currently carries a tint - including cells whose column is hidden right now
// (detached from the page), so none can keep a stale tint for when its column comes back.
const tinted = new Set();

function ruleIsActive(rule) {
  return Number.isFinite(rule.value);
}

function ruleMatches(rule, row) {
  const v = rule.leaf.get(row);
  return typeof v === 'number' && Number.isFinite(v) && rule.op.test(v, rule.value);
}

function highlightMatches(row) {
  return activeHighlight.length > 0 && activeHighlight.every((rule) => ruleMatches(rule, row));
}

// DataTables runs this for every gene on every draw, after its own search box. `rowData` is
// the gene's original record from `rows`.
function pruneFilter(settings, searchData, dataIndex, rowData) {
  if (settings.nTable.id !== 'catalog') return true;
  for (const rule of activePrune) {
    if (!ruleMatches(rule, rowData)) return false;
  }
  return true;
}

// Tint the genes on the current page that pass every Highlight rule. Runs after every draw
// (so paging, sorting and searching keep it right) and whenever a rule changes. Rows other
// pages hold are left alone: anything tinted before is cleared first, and they get tinted
// when they are next drawn.
function applyHighlights() {
  for (const td of tinted) td.classList.remove('hl', 'hl-gene');
  tinted.clear();
  if (!activeHighlight.length) return;
  const mark = (td, cls) => { if (td) { td.classList.add(cls); tinted.add(td); } };
  dt.rows({ page: 'current' }).every(function (rowIdx) {
    if (!highlightMatches(this.data())) return;
    if (geneLeaf) mark(dt.cell(rowIdx, geneLeaf.colIdx).node(), 'hl-gene');
    for (const rule of activeHighlight) mark(dt.cell(rowIdx, rule.leaf.colIdx).node(), 'hl');
  });
}

// How many of the genes the table is showing (every page) pass the Highlight rules.
function countHighlighted() {
  let n = 0;
  for (const row of dt.rows({ search: 'applied' }).data().toArray()) if (highlightMatches(row)) n++;
  return n;
}

// Range of a column over ALL genes (and how many have no value), shown beside the value box
// so you know what a sensible threshold looks like. Worked out on first use, then cached.
const statsCache = new Map();
function columnStats(leaf) {
  let s = statsCache.get(leaf);
  if (!s) {
    let min = Infinity, max = -Infinity, n = 0;
    for (const row of rows) {
      const v = leaf.get(row);
      if (typeof v === 'number' && Number.isFinite(v)) {
        n++;
        if (v < min) min = v;
        if (v > max) max = v;
      }
    }
    s = { n, blank: rows.length - n, min, max };
    statsCache.set(leaf, s);
  }
  return s;
}

function fmtHint(x) {   // 3 significant digits, no trailing zeros: 186, 0.0424, 1.23e-7
  return Number.isInteger(x) ? String(x) : String(Number(x.toPrecision(3)));
}

function rangeText(leaf) {
  const s = columnStats(leaf);
  if (!s.n) return 'no values';
  const range = s.min === s.max
    ? `all ${fmtHint(s.min)}`
    : `range ${fmtHint(s.min)} to ${fmtHint(s.max)}`;
  return s.blank ? `${range} \u00b7 ${s.blank} blank` : range;
}

// The column list. The short labels are ambiguous (Var / Mean / Median repeat under Windows
// and Location; "pi r2" and "slope" under every covariate's Window and Location), so each
// entry is the column's FULL nested path - "Salinity > Window > pi r2" - which is unique
// and still says exactly which column you picked once the list has closed. The <optgroup>
// headers (one per top-level group) are only there to make the open list easy to scan.
function buildColumnSelect() {
  const select = document.createElement('select');
  select.className = 'filter-col';
  select.setAttribute('aria-label', 'Column to filter on');

  const optionFor = (leaf) => {
    const o = document.createElement('option');
    o.value = String(leaf.colIdx);
    o.textContent = leaf.fullLabel;
    return o;
  };
  let general = null;   // numeric columns that sit in no group at all (Variants, N sites)
  for (const node of tree) {
    if (node.isGroup) {
      const numeric = node.leaves.filter((l) => l.numeric);
      if (!numeric.length) continue;
      const og = document.createElement('optgroup');
      og.label = node.label;
      for (const leaf of numeric) og.appendChild(optionFor(leaf));
      select.appendChild(og);
    } else if (node.numeric) {
      if (!general) {
        general = document.createElement('optgroup');
        general.label = 'General';
        select.appendChild(general);
      }
      general.appendChild(optionFor(node));
    }
  }
  return select;
}

function buildRuleRow(rule) {
  const row = document.createElement('div');
  row.className = 'filter-rule';
  row.setAttribute('role', 'group');

  // "[Keep v] genes where" - every row reads as a complete sentence, whichever switch it's on.
  const lead = document.createElement('span');
  lead.className = 'filter-lead';
  lead.title = 'A gene must pass every Keep rule to stay in the table, and every Highlight rule to be highlighted';
  const modeSel = document.createElement('select');
  modeSel.className = 'filter-mode';
  modeSel.setAttribute('aria-label', 'What this rule does');
  for (const m of FILTER_MODES) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.label;
    modeSel.appendChild(o);
  }
  modeSel.value = rule.mode;
  modeSel.title = FILTER_MODES.find((m) => m.id === rule.mode).title;
  lead.append(modeSel, ' genes where');

  const colSel = buildColumnSelect();
  colSel.value = String(rule.leaf.colIdx);

  const opSel = document.createElement('select');
  opSel.className = 'filter-op';
  opSel.setAttribute('aria-label', 'Comparison');
  for (const op of FILTER_OPS) {
    const o = document.createElement('option');
    o.value = op.id;
    o.textContent = op.label;
    o.title = op.title;
    opSel.appendChild(o);
  }
  opSel.value = rule.op.id;

  const valIn = document.createElement('input');
  valIn.type = 'number';
  valIn.step = 'any';
  valIn.className = 'filter-val';
  valIn.placeholder = 'value';
  valIn.setAttribute('aria-label', 'Threshold');

  const range = document.createElement('span');
  range.className = 'filter-range';
  const note = document.createElement('span');
  note.className = 'filter-note';

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'chip filter-remove';
  remove.textContent = '\u2715';
  remove.title = 'Remove this filter';
  remove.setAttribute('aria-label', 'Remove this filter');

  row.append(lead, colSel, opSel, valIn, range, note, remove);
  rule.el = row;
  rule.ui = { modeSel, colSel, range, note };

  modeSel.addEventListener('change', () => {
    rule.mode = modeSel.value;
    modeSel.title = FILTER_MODES.find((m) => m.id === rule.mode).title;
    applyFilters();
  });
  colSel.addEventListener('change', () => {
    rule.leaf = leafByCol.get(Number(colSel.value));
    refreshFilterUi();
    applyFilters();
  });
  opSel.addEventListener('change', () => {
    rule.op = FILTER_OPS.find((o) => o.id === opSel.value);
    applyFilters();
  });
  // Typing filters as you go, but only after a short pause - a big table shouldn't be
  // redrawn on every keystroke. Enter, leaving the box and the spinner arrows apply at once.
  let pending = null;
  const commit = () => {
    clearTimeout(pending);
    rule.value = valIn.valueAsNumber;   // NaN while the box is empty or half-typed -> rule stays inactive
    applyFilters();
  };
  valIn.addEventListener('input', () => { clearTimeout(pending); pending = setTimeout(commit, 200); });
  valIn.addEventListener('change', commit);
  remove.addEventListener('click', () => removeRule(rule));
  return row;
}

function addRule() {
  const rule = { leaf: filterLeaves[0], op: FILTER_OPS[0], value: null, mode: 'prune', el: null, ui: null };
  filterRules.push(rule);
  document.getElementById('filter-rules').appendChild(buildRuleRow(rule));
  refreshFilterUi();
  updateFilterSummary();
  rule.ui.colSel.focus();
}

function removeRule(rule) {
  filterRules.splice(filterRules.indexOf(rule), 1);
  rule.el.remove();
  refreshFilterUi();
  applyFilters();
  document.getElementById('filter-add').focus();
}

function clearRules() {
  for (const rule of filterRules) rule.el.remove();
  filterRules.length = 0;
  refreshFilterUi();
  applyFilters();
  document.getElementById('filter-add').focus();
}

// Re-read the rules. Only a change to the Keep rules changes WHICH genes the table shows, so
// only then is a redraw needed (it also puts the tint back via the 'draw' listener). A change
// that only touches Highlight rules - or a half-made rule - just re-tints the current page.
function applyFilters() {
  activePrune = filterRules.filter((r) => r.mode === 'prune' && ruleIsActive(r));
  activeHighlight = filterRules.filter((r) => r.mode === 'highlight' && ruleIsActive(r));
  const signature = activePrune.map((r) => `${r.leaf.colIdx}|${r.op.id}|${r.value}`).join(';');
  if (signature !== lastPruneSignature) {
    lastPruneSignature = signature;
    dt.draw();   // full reset: back to page 1, so a shorter result never strands you on an empty page
  } else {
    applyHighlights();
    updateFilterSummary();
  }
}

// Everything in the panel that depends on which rules exist, or which columns are showing.
function refreshFilterUi() {
  if (!filterPanelReady) return;
  for (const rule of filterRules) {
    const { colSel, range, note } = rule.ui;
    colSel.title = `${rule.leaf.fullLabel}  [${rule.leaf.key}]`;
    range.textContent = rangeText(rule.leaf);
    range.title = columnStats(rule.leaf).blank ? 'Genes with no value in this column are hidden by a Keep rule on it, and never highlighted' : '';
    note.textContent = rule.leaf.visible ? '' : '(column currently hidden)';
  }
  document.getElementById('filter-clear').hidden = !filterRules.length;
}

function updateFilterSummary() {
  const el = document.getElementById('filter-summary');
  el.textContent = '';
  if (!filterRules.length) return;
  if (!activePrune.length && !activeHighlight.length) {
    el.textContent = 'Enter a value to apply the filter.';
    return;
  }
  const info = dt.page.info();
  const parts = [];
  if (activePrune.length) parts.push(`${info.recordsDisplay} of ${info.recordsTotal} genes shown`);
  if (activeHighlight.length) {
    const n = countHighlighted();
    const swatch = document.createElement('span');
    swatch.className = 'hl-swatch';
    swatch.setAttribute('aria-hidden', 'true');
    if (parts.length) parts.push(' \u00b7 ');
    parts.push(swatch, activePrune.length ? `${n} highlighted` : `${n} of ${info.recordsDisplay} genes highlighted`);
  }
  el.append(...parts);
}

function buildFilterPanel() {
  if (!filterLeaves.length) return;   // no numeric column to filter on - the panel stays hidden
  DataTable.ext.search.push(pruneFilter);
  document.getElementById('filter-add').addEventListener('click', addRule);
  document.getElementById('filter-clear').addEventListener('click', clearRules);
  dt.on('draw', () => { applyHighlights(); updateFilterSummary(); });
  document.getElementById('filter-panel').hidden = false;
  filterPanelReady = true;
}

// --- Table -------------------------------------------------------------------
try {
  buildHeader();
  dt = new DataTable('#catalog', {
    data: rows,
    columns: [
      { data: 'plots', orderable: false, searchable: false, className: 'thumb', render: renderThumb },
      ...leaves.map(toDtColumn),
    ],
    order: DEFAULT_ORDER,
    pageLength: 25,
    lengthMenu: [10, 25, 50, 100, 500],
    autoWidth: false,
  });
  buildToolbar();
  buildFilterPanel();
} catch (err) {
  console.error(err);
  showError('The table could not be built: ' + err.message + ' (details in the browser console)');
}

// "Decimals": draw() alone only re-uses each cell's cached HTML, so the
// numbers would not change. invalidate('data') makes DataTables call the
// render functions again (for the cells already created, and for the search
// cache), and draw(false) then repaints the current page in place.
document.getElementById('decimals-input').addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  if (!dt || Number.isNaN(v) || v < 0 || v > 10) return;
  decimals = v;
  dt.rows().invalidate('data').draw(false);
});

// --- Lightbox ----------------------------------------------------------
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const caption = lightbox.querySelector('.caption');
let plotIdx = 0, plotList = [];

lightboxImg.addEventListener('error', () => {
  const failedSrc = plotList[plotIdx];
  caption.textContent = `${plotIdx + 1} / ${plotList.length} — failed to load: ${failedSrc.split('/').pop()}`;
  lightboxImg.src = BROKEN_IMG_PLACEHOLDER;
});

function showPlot() {
  lightboxImg.src = plotList[plotIdx];
  lightboxImg.alt = plotList[plotIdx].split('/').pop();
  caption.textContent = `${plotIdx + 1} / ${plotList.length} — ${plotList[plotIdx].split('/').pop()}`;
}

lightboxImg.addEventListener('click', (e) => {
  e.stopPropagation();
  plotIdx = (plotIdx + 1) % plotList.length;
  showPlot();
});

document.addEventListener('click', (e) => {
  const img = e.target.closest('td.thumb img');
  if (img) {
    plotList = JSON.parse(img.dataset.plots);
    plotIdx = 0;
    showPlot();
    lightbox.classList.add('open');
  } else if (e.target === lightbox) {
    lightbox.classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') lightbox.classList.remove('open');
  if (e.key === 'ArrowRight') { plotIdx = (plotIdx + 1) % plotList.length; showPlot(); }
  if (e.key === 'ArrowLeft') { plotIdx = (plotIdx - 1 + plotList.length) % plotList.length; showPlot(); }
});
</script>
</body>
</html>
