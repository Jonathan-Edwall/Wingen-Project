<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene catalog</title>
<link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
<style>
  :root {
    --text:  #1a1a1a;
    --muted: #666666;
    --line:  #dddddd;
    --hover: #f5f5f5;
    --mono:  ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }
  body {
    margin: 24px 32px 64px;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .meta {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .meta.error {
    color: #b91c1c;
    background: #fee0e0;
    border: 1px solid #f5b5b5;
    border-radius: 4px;
    padding: 6px 10px;
  }
  .meta.error[hidden] { display: none; }
  table.dataTable {
    width: 100% !important;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.dataTable thead th {
    border-bottom: 2px solid var(--text) !important;
    text-align: left;
    padding: 6px 10px !important;
    white-space: nowrap;
  }
  table.dataTable tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.dataTable tbody tr:hover { background: var(--hover); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.gene-id { font-family: var(--mono); }
  td.thumb { width: 50px; }
  td.thumb img {
    width: 44px; height: 28px; object-fit: cover; cursor: zoom-in; display: block;
  }

  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.85);
    align-items: center; justify-content: center; padding: 32px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; }
  #lightbox .caption {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: var(--mono); font-size: 13px;
  }

  /* Group header cells. They are click-to-hide controls, not sort controls:
     they carry data-dt-order="disable" (set in buildHeader), so DataTables
     draws no sort arrows on them and never sorts when they are clicked. */
  table.dataTable thead th.group {
    text-align: center;
    border-bottom: 1px solid var(--line) !important;
    cursor: pointer;
    user-select: none;
  }
  table.dataTable thead th.group:hover { background: var(--hover); }

  #toolbar {
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 10px 22px; margin-bottom: 14px;
  }
  .decimals-control {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0;
  }
  .decimals-control input {
    width: 3.5em; padding: 2px 4px; font-family: var(--mono); font-size: 13px;
  }

  /* Column-group toolbar. A group with sub-groups (Salinity, Water Temp...)
     is drawn as ONE outlined cluster - the group's own button first, then
     its sub-group buttons inside the same outline - so "Window"/"Location"
     visibly belong to the covariate they sit under, instead of reading as
     more top-level siblings of the top-level "Windows"/"Location". */
  #group-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .toolbar-label { font-size: 13px; color: var(--muted); }
  .cluster { display: inline-flex; align-items: center; gap: 4px; }
  .cluster.has-children {
    padding: 1px 4px 1px 1px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: #fafafa;
  }
  .cluster.has-children > .chip { border-color: transparent; background: transparent; font-weight: 600; }
  .cluster.has-children > .chip:hover { background: var(--hover); }
  .cluster-children {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding-left: 6px; margin-left: 2px;
    border-left: 1px solid var(--line);
  }
  .chip {
    font: inherit; font-size: 12px; line-height: 1.4;
    padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: var(--hover); }
  .chip:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .chip.collapsed {
    color: var(--muted); background: var(--hover);
    border-style: dashed; text-decoration: line-through;
  }
</style>
</head>

  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 28">'
  + '<rect width="44" height="28" fill="#fee0e0"/>'
  + '<text x="22" y="19" font-size="15" text-anchor="middle" fill="#b91c1c" font-family="sans-serif">?</text>'
  + '</svg>'
);

function handleImgError(img) {
  if (img.dataset.broken) return; // the placeholder itself never fails to load; this just guards belt-and-braces
  const failedSrc = img.getAttribute('src');
  img.dataset.broken = '1';
  img.src = BROKEN_IMG_PLACEHOLDER;
  img.title = 'Failed to load: ' + failedSrc.split('/').pop();
}

function renderThumb(plots, type, row) {
  if (type !== 'display' || !plots || !plots.length) return '';
  return `<img src="${escapeHtml(plots[0])}" alt="${escapeHtml(row.gene_id)}"`
       + ` data-plots="${escapeHtml(JSON.stringify(plots))}" onerror="handleImgError(this)">`;
}

// --- Column layout tree ------------------------------------------------------
// columnLayout can nest groups inside groups (a covariate's Window/Location
// halves, say). Built once: every group knows its children and every leaf
// beneath it (`leaves`); every leaf knows its DataTables column index
// (`colIdx`) and whether it is currently shown (`visible`).
function buildNode(node, parentPath) {
  if (node.group) {
    const path = parentPath ? `${parentPath} \u203a ${node.group}` : node.group;
    const group = { isGroup: true, label: node.group, path, chip: null, children: [], leaves: [] };
    group.children = node.columns.map((c) => buildNode(c, path));
    for (const child of group.children) {
      if (child.isGroup) group.leaves.push(...child.leaves);
      else group.leaves.push(child);
    }
    return group;
  }
  return { isGroup: false, key: node.key, label: node.label, numeric: !!node.numeric, colIdx: -1, visible: true };
}
const tree = columnLayout.map((node) => buildNode(node, ''));

// Every leaf, left to right. This is DataTables' column order, so
// leaf i is DataTables column i + 1 (column 0 is the thumbnail).
const leaves = [];
(function collect(nodes) {
  for (const n of nodes) {
    if (n.isGroup) collect(n.children);
    else leaves.push(n);
  }
})(tree);
leaves.forEach((leaf, i) => { leaf.colIdx = i + 1; });

function treeDepth(nodes) {
  let max = 1;
  for (const n of nodes) {
    if (n.isGroup) max = Math.max(max, 1 + treeDepth(n.children));
  }
  return max;
}
const maxDepth = treeDepth(tree);

function toDtColumn(leaf) {
  return {
    data: leaf.key,
    className: leaf.numeric ? 'num' : (leaf.key === 'gene_id' ? 'gene-id' : ''),
    type: leaf.numeric ? 'num' : 'string',
    // A gene whose JSON lacks a field (e.g. it errored before computing that
    // block) gets an empty cell rather than DataTables' "unknown parameter" error.
    defaultContent: '',
    // Text columns: escape, so a gene name containing "<" or "&" can't be
    // read as markup (DataTables writes cell content with innerHTML).
    render: leaf.numeric ? renderNumber : DataTable.render.text(),
  };
}

// --- Header ------------------------------------------------------------------
// The full multi-row <thead> is built ONCE, for every column, and never
// rebuilt. Hiding and showing columns is DataTables' own job from here on
// (columns().visible(), see setLeavesVisible): it re-computes each header
// cell's colspan/rowspan from the columns still visible, and drops a group
// cell entirely once nothing under it is visible.
//
// Why this is NOT done by destroying and re-initialising the table on every
// toggle: destroy() puts the old rendered <tr> rows back into the <table>,
// and DataTables' constructor then checks that first leftover row against
// the new `columns` array. Hide a group and the leftover row has MORE cells
// than there are columns -> "Incorrect column count" (tech note 18) and an
// uncaught TypeError halfway through init, leaving a half-built table (and
// a second toggle then removed the table from the page altogether).
function buildHeader() {
  const thead = document.querySelector('#catalog thead');
  const headerRows = Array.from({ length: maxDepth }, () => document.createElement('tr'));

  const thumbTh = document.createElement('th');
  thumbTh.rowSpan = maxDepth;
  headerRows[0].appendChild(thumbTh);

  function place(node, row) {
    const th = document.createElement('th');
    th.textContent = node.label;
    if (node.isGroup) {
      th.colSpan = node.leaves.length;
      th.className = 'group';
      th.title = 'Click to hide this group';
      // DataTables 2 attaches sorting to EVERY header cell, and a cell that
      // spans several columns would multi-sort by all of them. This attribute
      // opts group cells out: no sort arrows, and clicking one only hides it.
      // (A mouse shortcut only - the toolbar buttons are the keyboard/screen-
      // reader route to the same toggle.)
      th.setAttribute('data-dt-order', 'disable');
      th.addEventListener('click', () => hideGroup(node));
      headerRows[row].appendChild(th);
      for (const child of node.children) place(child, row + 1);
    } else {
      // A leaf spans down to the last header row, however deep its group is.
      th.rowSpan = maxDepth - row;
      if (node.numeric) th.className = 'num';
      headerRows[row].appendChild(th);
    }
  }
  for (const node of tree) place(node, 0);
  for (const tr of headerRows) thead.appendChild(tr);
}

// --- Column visibility -------------------------------------------------------
// A group's state is derived from its leaves - nothing is stored per group:
//   'all'  every column under it is shown
//   'none' every column under it is hidden
//   'some' mixed (e.g. Salinity with only its Window half hidden)
function groupState(group) {
  const shown = group.leaves.filter((l) => l.visible).length;
  if (shown === 0) return 'none';
  return shown === group.leaves.length ? 'all' : 'some';
}

let dt = null;

function setLeavesVisible(targets, show) {
  const changed = targets.filter((l) => l.visible !== show);
  if (!changed.length || !dt) return;
  for (const leaf of changed) leaf.visible = show;
  dt.columns(changed.map((l) => l.colIdx)).visible(show);
  if (!show) dropHiddenSortColumns();
  refreshToolbar();
}

// Ordering by a column the reader can no longer see would leave rows in an
// order nothing on screen explains, so drop those sort keys (falling back to
// the default order if none are left).
function dropHiddenSortColumns() {
  const current = dt.order();
  const kept = current.filter(([idx]) => dt.column(idx).visible());
  if (kept.length !== current.length) dt.order(kept.length ? kept : DEFAULT_ORDER).draw(false);
}

// Toolbar button: everything shown -> hide it all; otherwise (hidden or
// mixed) -> show it all.
function toggleGroup(group) {
  setLeavesVisible(group.leaves, groupState(group) !== 'all');
}
// Header click: always "hide".
function hideGroup(group) {
  setLeavesVisible(group.leaves, false);
}

// --- Toolbar -----------------------------------------------------------------
const GLYPH = { all: '\u2611 ', none: '\u2610 ', some: '\u25A3 ' }; // ballot box: checked / empty / partial

// The DOM is built once, and refreshToolbar() only updates each button's
// state in place - so a button keeps keyboard focus after you press it.
function buildToolbar() {
  if (!tree.some((n) => n.isGroup)) return;   // nothing to toggle - leave the toolbar empty
  const container = document.getElementById('group-toolbar');
  const label = document.createElement('span');
  label.className = 'toolbar-label';
  label.textContent = 'Columns:';
  container.appendChild(label);

  // One cluster per group: its button, then (if it has sub-groups) a nested
  // container of clusters for those - recursive, so any depth reads right.
  function clusterFor(group) {
    const subgroups = group.children.filter((c) => c.isGroup);
    const cluster = document.createElement('span');
    cluster.className = 'cluster' + (subgroups.length ? ' has-children' : '');

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.setAttribute('role', 'checkbox');
    chip.title = `Show or hide: ${group.path}`;
    chip.addEventListener('click', () => toggleGroup(group));
    group.chip = chip;
    cluster.appendChild(chip);

    if (subgroups.length) {
      const inner = document.createElement('span');
      inner.className = 'cluster-children';
      for (const sub of subgroups) inner.appendChild(clusterFor(sub));
      cluster.appendChild(inner);
    }
    return cluster;
  }
  for (const node of tree) {
    if (node.isGroup) container.appendChild(clusterFor(node));
  }
  refreshToolbar();
}

function refreshToolbar() {
  (function walk(nodes) {
    for (const n of nodes) {
      if (!n.isGroup) continue;
      const state = groupState(n);
      n.chip.textContent = GLYPH[state] + n.label;
      n.chip.classList.toggle('collapsed', state === 'none');
      n.chip.setAttribute('aria-checked', state === 'all' ? 'true' : state === 'none' ? 'false' : 'mixed');
      walk(n.children);
    }
  })(tree);
}

// --- Table -------------------------------------------------------------------
try {
  buildHeader();
  dt = new DataTable('#catalog', {
    data: rows,
    columns: [
      { data: 'plots', orderable: false, searchable: false, className: 'thumb', render: renderThumb },
      ...leaves.map(toDtColumn),
    ],
    order: DEFAULT_ORDER,
    pageLength: 25,
    lengthMenu: [10, 25, 50, 100, 500],
    autoWidth: false,
  });
  buildToolbar();
} catch (err) {
  console.error(err);
  showError('The table could not be built: ' + err.message + ' (details in the browser console)');
}

// "Decimals": draw() alone only re-uses each cell's cached HTML, so the
// numbers would not change. invalidate('data') makes DataTables call the
// render functions again (for the cells already created, and for the search
// cache), and draw(false) then repaints the current page in place.
document.getElementById('decimals-input').addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  if (!dt || Number.isNaN(v) || v < 0 || v > 10) return;
  decimals = v;
  dt.rows().invalidate('data').draw(false);
});

// --- Lightbox ----------------------------------------------------------
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const caption = lightbox.querySelector('.caption');
let plotIdx = 0, plotList = [];

lightboxImg.addEventListener('error', () => {
  const failedSrc = plotList[plotIdx];
  caption.textContent = `${plotIdx + 1} / ${plotList.length} — failed to load: ${failedSrc.split('/').pop()}`;
  lightboxImg.src = BROKEN_IMG_PLACEHOLDER;
});

function showPlot() {
  lightboxImg.src = plotList[plotIdx];
  lightboxImg.alt = plotList[plotIdx].split('/').pop();
  caption.textContent = `${plotIdx + 1} / ${plotList.length} — ${plotList[plotIdx].split('/').pop()}`;
}

lightboxImg.addEventListener('click', (e) => {
  e.stopPropagation();
  plotIdx = (plotIdx + 1) % plotList.length;
  showPlot();
});

document.addEventListener('click', (e) => {
  const img = e.target.closest('td.thumb img');
  if (img) {
    plotList = JSON.parse(img.dataset.plots);
    plotIdx = 0;
    showPlot();
    lightbox.classList.add('open');
  } else if (e.target === lightbox) {
    lightbox.classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') lightbox.classList.remove('open');
  if (e.key === 'ArrowRight') { plotIdx = (plotIdx + 1) % plotList.length; showPlot(); }
  if (e.key === 'ArrowLeft') { plotIdx = (plotIdx - 1 + plotList.length) % plotList.length; showPlot(); }
});
</script>
</body>
</html>
